# SonarQube Project Configuration for Enjaz Habit Tracker
sonar.projectKey=enjaz-habit-tracker
sonar.projectName=Enjaz Habit Tracker
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=src
sonar.tests=tests

# File Encodings & Languages
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Exclusions
sonar.exclusions=node_modules/**,android/**,dist/**,.expo/**,scripts/**,store_assets/**,docs/**
sonar.coverage.exclusions=tests/**,scripts/**,**/*.test.ts,**/*.test.tsx

# Quality & Architecture rules
sonar.javascript.environments=react,node
